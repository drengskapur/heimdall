name: scorecard

# OpenSSF Scorecard: the automated read of this repository's security posture.
# Results go to the Security tab as SARIF, and the badge in the README reads the
# published score.
#
# It runs on push to main rather than on pull requests, because several checks
# (Branch-Protection, Code-Review) inspect repository settings and history that a
# fork's pull request cannot see.
permissions:
  contents: read

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "31 5 * * 2"
  workflow_dispatch:

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF results
      id-token: write # publish the result so the badge can read it
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score to the public OpenSSF API, which is what makes
          # the README badge work. It exposes nothing the repository does not.
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          sarif_file: results.sarif
