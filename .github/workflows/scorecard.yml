name: scorecard

# OpenSSF Scorecard: the automated read of this repository's security posture.
# Results go to the Security tab as SARIF, and the badge in the README reads the
# published score.
#
# It runs on push to main rather than on pull requests, because several checks
# (Branch-Protection, Code-Review) inspect repository settings and history that a
# fork's pull request cannot see.
permissions:
  contents: read

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "31 5 * * 2"
  workflow_dispatch:

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF results
      id-token: write # publish the result so the badge can read it
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score to the public OpenSSF API, which is what makes
          # the README badge work. It exposes nothing the repository does not.
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v3
        with:
          sarif_file: results.sarif
