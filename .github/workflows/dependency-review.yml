name: dependency-review

# Fails a pull request that introduces a dependency with a known vulnerability,
# or one whose licence we cannot ship. Cheaper than finding out at release.
permissions:
  contents: read

on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # leave the summary as a comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # Apache-2.0 project: copyleft that would reach the distributed bundle
          # is the thing to catch. GPL/AGPL in a dev dependency is still worth a
          # decision rather than a surprise.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-2.1, LGPL-3.0
